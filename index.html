<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria Mach-One Planalto</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }

    header {
      background-color: #262626;
      color: #fff;
      padding: 15px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    header img {
      height: 50px;
      margin-bottom: 5px;
    }

    header h1 {
      font-size: 24px;
      font-weight: bold;
      text-transform: uppercase;
      margin: 0;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .galeria .grid-item {
      position: relative;
      padding-bottom: 100%;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease-in-out;
      cursor: pointer;
    }

    .galeria .grid-item:hover {
      transform: scale(1.03);
    }

    .galeria .grid-item img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Modal (imagem ampliada) */
    .modal {
      display: none;
      /* Agora não inicia aberto */
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
    }

    /* Contêiner para a imagem e as setas */
    .modal-content-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 95%;
      max-height: 95%;
      position: relative;
    }

    /* Imagem dentro do modal */
    .modal-content-wrapper img {
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
      border-radius: 10px;
      display: block;
    }

    /* Botão de fechar (X) */
    .modal span#fechar {
      position: absolute;
      top: 20px;
      right: 40px;
      color: white;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1001;
    }

    /* Setas */
    /* Setas de navegação */
    .seta {
      position: fixed;
      /* antes estava absolute */
      top: 50%;
      transform: translateY(-50%);
      font-size: 3rem;
      color: white;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      z-index: 1100;
      /* fica acima da imagem */
      padding: 15px;
      border-radius: 50%;
      background-color: rgba(0, 0, 0, 0.4);
      transition: background-color 0.3s;
    }

    .seta:hover {
      background-color: rgba(0, 0, 0, 0.7);
    }

    /* Esquerda e direita afastadas da imagem */
    .seta.esquerda {
      left: 40px;
      /* aumenta distância da borda */
    }

    .seta.direita {
      right: 40px;
      /* aumenta distância da borda */
    }

    /* Ajustes para telas menores */
    @media (max-width: 768px) {
      .seta.esquerda {
        left: 10px;
      }

      .seta.direita {
        right: 10px;
      }

      .modal span#fechar {
        top: 10px;
        right: 15px;
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

    <!-- ... demais imagens ... -->
  </div>

  <div id="modal" class="modal">
    <span id="fechar">&times;</span>
    <div class="modal-content-wrapper">
      <span class="seta esquerda" id="anterior">&#10094;</span>
      <img id="modalImg" src="" alt="Imagem Ampliada">
      <span class="seta direita" id="proxima">&#10095;</span>
    </div>
  </div>

  <script>
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");
    const fechar = document.getElementById("fechar");
    const btnAnterior = document.getElementById("anterior");
    const btnProxima = document.getElementById("proxima");

    const imagens = document.querySelectorAll(".galeria .grid-item img");
    let indexAtual = 0;

    imagens.forEach((img, index) => {
      img.addEventListener("click", () => {
        modal.style.display = "flex";
        modalImg.src = img.src;
        indexAtual = index;
      });
    });

    fechar.onclick = () => {
      modal.style.display = "none";
    };

    modal.addEventListener("click", (e) => {
      if (e.target === modal || e.target === fechar) {
        modal.style.display = "none";
      }
    });

    btnAnterior.addEventListener("click", (e) => {
      e.stopPropagation();
      indexAtual = (indexAtual - 1 + imagens.length) % imagens.length;
      modalImg.src = imagens[indexAtual].src;
    });

    btnProxima.addEventListener("click", (e) => {
      e.stopPropagation();
      indexAtual = (indexAtual + 1) % imagens.length;
      modalImg.src = imagens[indexAtual].src;
    });

    document.addEventListener("keydown", (e) => {
      if (modal.style.display === "flex") {
        if (e.key === "ArrowLeft") {
          indexAtual = (indexAtual - 1 + imagens.length) % imagens.length;
          modalImg.src = imagens[indexAtual].src;
        } else if (e.key === "ArrowRight") {
          indexAtual = (indexAtual + 1) % imagens.length;
          modalImg.src = imagens[indexAtual].src;
        } else if (e.key === "Escape") {
          modal.style.display = "none";
        }
      }
    });
  </script>
