<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Galeria Mach-One Planalto</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }

    header {
      background-color: #262626;
      color: #fff;
      padding: 15px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    header img {
      height: 50px;
      margin-bottom: 5px;
    }

    header h1 {
      font-size: 24px;
      font-weight: bold;
      text-transform: uppercase;
      margin: 0;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .galeria .grid-item {
      position: relative;
      padding-bottom: 100%;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, .2);
      transition: transform .3s ease-in-out;
      cursor: pointer;
    }

    .galeria .grid-item:hover {
      transform: scale(1.03);
    }

    .galeria .grid-item img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, .9);
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    .modal-content-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      max-width: 90vw;
      max-height: 90vh;
      overflow: hidden;
    }

    #modalImg {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      display: block;
      transform-origin: center center;
    }

    #modalImg.rotated-right {
      transform: rotate(-90deg);
      max-width: 90vh;
      max-height: 90vw;
    }

    .modal span#fechar {
      position: absolute;
      top: 20px;
      right: 40px;
      color: white;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1100;
    }

    .seta {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      font-size: 3rem;
      color: white;
      cursor: pointer;
      user-select: none;
      z-index: 1100;
      padding: 12px;
      border-radius: 50%;
      background-color: rgba(0, 0, 0, 0.35);
      transition: background-color .15s;
    }

    .seta:hover {
      background-color: rgba(0, 0, 0, 0.6);
    }

    .seta.esquerda {
      left: 40px;
    }

    .seta.direita {
      right: 40px;
    }

    @media (max-width: 768px) {
      .seta.esquerda {
        left: 10px;
      }

      .seta.direita {
        right: 10px;
      }

      .modal span#fechar {
        top: 10px;
        right: 15px;
        font-size: 30px;
      }

      #modalImg.rotated-right {
        max-width: 80vh;
        max-height: 80vw;
      }
    }
  </style>
</head>

<body>

    <h1>Galeria Mach-One Planalto</h1>

  </div>

  <div id="modal" class="modal">
    <span id="fechar">&times;</span>
    <div class="modal-content-wrapper">
      <span class="seta esquerda" id="anterior">&#10094;</span>
      <img id="modalImg" src="" alt="Imagem Ampliada">
      <span class="seta direita" id="proxima">&#10095;</span>
    </div>
  </div>

  <script>
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");
    const fechar = document.getElementById("fechar");
    const btnAnterior = document.getElementById("anterior");
    const btnProxima = document.getElementById("proxima");

    const rotateRightSet = new Set([10, 23, 26]);
    const imagens = document.querySelectorAll(".galeria .grid-item img");
    let indexAtual = 0;

    imagens.forEach((img, index) => {
      img.addEventListener("click", () => {
        indexAtual = index;
        openModalWithIndex(indexAtual);
      });
    });

    function openModalWithIndex(idx) {
      modalImg.src = imagens[idx].src;
      modalImg.classList.remove("rotated-right");
      if (rotateRightSet.has(idx + 1)) modalImg.classList.add("rotated-right");
      modal.style.display = "flex";
    }

    function closeModal() {
      modal.style.display = "none";
      modalImg.classList.remove("rotated-right");
      modalImg.src = "";
    }

    fechar.onclick = closeModal;
    modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });

    btnAnterior.addEventListener("click", e => {
      e.stopPropagation();
      indexAtual = (indexAtual - 1 + imagens.length) % imagens.length;
      openModalWithIndex(indexAtual);
    });

    btnProxima.addEventListener("click", e => {
      e.stopPropagation();
      indexAtual = (indexAtual + 1) % imagens.length;
      openModalWithIndex(indexAtual);
    });

    document.addEventListener("keydown", e => {
      if (modal.style.display === "flex") {
        if (e.key === "ArrowLeft") {
          indexAtual = (indexAtual - 1 + imagens.length) % imagens.length;
          openModalWithIndex(indexAtual);
        } else if (e.key === "ArrowRight") {
          indexAtual = (indexAtual + 1) % imagens.length;
          openModalWithIndex(indexAtual);
        } else if (e.key === "Escape") {
          closeModal();
        }
      }
    });
  </script>
